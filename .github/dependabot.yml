version: 2

updates:
  # Actions used by .github/workflows/release.yml. Grouped so a week's bumps
  # arrive as one PR rather than five.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # third_party/esp-thread-br tracks upstream main, which moves often, so this
  # runs monthly to stay quiet. Each PR is built by the same workflow, so a
  # bump that breaks the firmware fails before it can be merged.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
